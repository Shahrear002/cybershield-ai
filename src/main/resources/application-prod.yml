spring:
  # ── Persistent File-Based H2 Database (for Production/Tomcat deployment) ──
  # Uses the user home (~) folder to ensure Tomcat always has write permissions
  datasource:
    url: jdbc:h2:file:~/cybershield/db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # ── JPA / Hibernate (Ensure schemas are preserved across restarts) ────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
