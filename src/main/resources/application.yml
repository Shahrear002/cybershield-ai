spring:
  application:
    name: cybershield-ai

  # ── PostgreSQL Database (Global) ──────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cybershield}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Multipart file upload (for /api/evidence/secure) ─────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # ── Spring AI — provider key, base-url, and model settings live in ────────
  # ── src/main/resources/application.properties (see that file to swap       ──
  # ── between OpenAI, Groq, and OpenRouter with a single line change).       ──

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.cybershield: DEBUG
    org.springframework.web: INFO
    org.springframework.ai: DEBUG
