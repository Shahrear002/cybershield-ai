spring:
  application:
    name: cybershield-ai

  # ── H2 In-Memory Database (dev profile) ──────────────────────────────────
  datasource:
    url: jdbc:h2:mem:cybershielddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Multipart file upload (for /api/evidence/secure) ─────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # ── Spring AI — provider key, base-url, and model settings live in ────────
  # ── src/main/resources/application.properties (see that file to swap       ──
  # ── between OpenAI, Groq, and OpenRouter with a single line change).       ──

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.cybershield: DEBUG
    org.springframework.web: INFO
    org.springframework.ai: DEBUG
