# =============================================================================
# CyberShield AI — Spring AI / LLM provider configuration
# =============================================================================
# This file contains all API key and endpoint settings for the AI layer.
# It is intentionally separate from application.yml so that:
#   1. Developers can .gitignore this file in production deployments.
#   2. The base-url can be swapped between providers without touching any Java code.
#   3. Environment-variable overrides (${ENV_VAR:default}) surface clearly here.
#
# USAGE:
#   Set your chosen provider's key as an environment variable BEFORE starting:
#     export OPENAI_API_KEY=sk-...       (OpenAI)
#     export GROQ_API_KEY=gsk_...        (Groq)
#     export OPENROUTER_API_KEY=sk-or-.. (OpenRouter)
#   Then run:
#     ./mvnw spring-boot:run
# =============================================================================


# -----------------------------------------------------------------------------
# OPTION 1 — OpenAI (default)
# Models: gpt-4o, gpt-4o-mini, gpt-3.5-turbo
# Pricing: https://openai.com/pricing
# -----------------------------------------------------------------------------
# spring.ai.openai.api-key=${OPENAI_API_KEY:REPLACE_WITH_YOUR_OPENAI_KEY}
# spring.ai.openai.base-url=https://api.openai.com


# -----------------------------------------------------------------------------
# OPTION 2 — Groq (fast inference, OpenAI-compatible API)
# Swap BOTH lines below into the active block to use Groq.
# Models: llama-3.3-70b-versatile, mixtral-8x7b-32768, gemma2-9b-it
# Docs:   https://console.groq.com/docs/openai
# -----------------------------------------------------------------------------
spring.ai.openai.api-key=${GROQ_API_KEY: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}
spring.ai.openai.base-url=https://api.groq.com/openai


# -----------------------------------------------------------------------------
# OPTION 3 — OpenRouter (multi-model gateway — access GPT-4, Claude, Gemini, etc.)
# Swap BOTH lines below into the active block to use OpenRouter.
# Models: openai/gpt-4o, anthropic/claude-3-5-sonnet, google/gemini-pro
# Docs:   https://openrouter.ai/docs
# -----------------------------------------------------------------------------
# spring.ai.openai.api-key=${OPENROUTER_API_KEY:REPLACE_WITH_YOUR_OPENROUTER_KEY}
# spring.ai.openai.base-url=https://openrouter.ai/api


# -----------------------------------------------------------------------------
# Model & inference settings (provider-agnostic — apply to whichever is active)
# -----------------------------------------------------------------------------

# Model identifier — must be a valid model name for the active provider.
# OpenAI:     gpt-4o-mini  (cost-efficient, fast)  | gpt-4o  (highest accuracy)
# Groq:       llama-3.3-70b-versatile               | mixtral-8x7b-32768
# OpenRouter: openai/gpt-4o-mini                    | anthropic/claude-3-haiku
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Temperature — controls response randomness.
# 0.0 = fully deterministic (best for structured JSON classification).
# 0.7 = balanced creativity (use for summarisation tasks).
# Keep at 0.1 or lower for BeanOutputConverter structured-output calls.
spring.ai.openai.chat.options.temperature=0.1

# Max tokens — caps the LLM response length.
# TriageAnalysis JSON is small (~200 tokens); 512 provides comfortable headroom.
spring.ai.openai.chat.options.max-tokens=512
